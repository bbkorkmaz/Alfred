# Alfred: her kod değişikliğinde imzalı APK üretir ve "Geliştirme sürümü" olarak yayınlar.
# Telefondan indirme adresi:
#   https://github.com/bbkorkmaz/Alfred/releases/download/gelistirme/Alfred-gelistirme.apk
#
# Gerekli Secrets (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64   : alfred.jks dosyasının base64 hali
#   KEYSTORE_PASSWORD : anahtar şifresi
name: APK derle

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch: # Actions sekmesinden elle de başlatılabilir

permissions:
  contents: write

concurrency:
  group: apk-derle
  cancel-in-progress: true

jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: İmza anahtarını hazırla
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::KEYSTORE_BASE64 veya KEYSTORE_PASSWORD secret'ı eksik. İmzasız APK telefondaki uygulamanın üzerine kurulamaz; derleme durduruldu."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/alfred.jks"
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=alfred"
            echo "storeFile=$RUNNER_TEMP/alfred.jks"
          } > android/key.properties

      - name: Bağımlılıkları indir
        run: flutter pub get

      - name: Kod denetimi
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: APK derle
        run: flutter build apk --release

      - name: APK'yı adlandır
        run: cp build/app/outputs/flutter-apk/app-release.apk Alfred-gelistirme.apk

      - name: Geliştirme sürümüne yükle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gelistirme
          name: Geliştirme sürümü (en son derleme)
          prerelease: true
          make_latest: false
          body: |
            Her kod değişikliğinden sonra kendiliğinden üretilen, denenmemiş derleme.
            Automatically built from the latest code; not yet tested.

            Kod / Commit: ${{ github.sha }}
            ${{ github.event.head_commit.message }}
          files: Alfred-gelistirme.apk

      - name: İmza dosyalarını temizle
        if: always()
        run: rm -f "$RUNNER_TEMP/alfred.jks" android/key.properties
